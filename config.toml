baseURL = 'https://swanand.me'
locale = 'en-us'
title = "Swanand Dhawan | Tinkering thoughts"
theme = 'paper'

enableGitInfo = true

# Posts exported with ox-hugo contain raw HTML (table-of-contents wrappers).
# Hugo drops it by default; keep that behaviour and silence the warning.
ignoreLogs = ['warning-goldmark-raw-html']

[module.hugoVersion]
  extended = true
  min = '0.158.0'

[services.googleAnalytics]
  ID = 'G-8FLQSX2479'

[services.disqus]
  shortname = 'https-swananddhawan-github-io'

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']

[params]
  author = 'Swanand Dhawan'
  twitter = 'swananddhawan'
  github = 'swananddhawan'

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
